name: Publish to npm

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v1.2.0). Defaults to the current ref.'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v1.3.0). Defaults to the current ref.'
        required: false
        type: string

jobs:
  # ── Gate: validate the packed tarball as a real consumer would install it ──
  # (builds better-sqlite3, exercises the bin, audits the prod tree)
  pack-verify:
    permissions:
      contents: read
    uses: ./.github/workflows/pack-verify.yml

  # ── Gate: lint + test must pass before publish ──
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test

  publish:
    needs: [pack-verify, test]
    runs-on: ubuntu-latest
    environment: lapis
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + --provenance
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing (OIDC) requires npm >= 11.5.1 (node 24 bundles npm 11)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: npm ci

      # Verify package.json version matches the release tag
      - name: Verify version matches tag
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG_NAME#v}"
          echo "package.json: $PKG_VERSION  |  tag: $TAG_VERSION"
          [ "$PKG_VERSION" = "$TAG_VERSION" ] || { echo "::error::Version mismatch — tag=$TAG_VERSION pkg=$PKG_VERSION"; exit 1; }

      # TEMP DEBUG: print the OIDC identity GitHub presents to npm — compare with
      # the Trusted Publisher form on npmjs.com field by field, then remove me.
      - name: Debug OIDC claims
        run: |
          echo "npm version: $(npm --version)"
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,base64,json;s=sys.stdin.read().strip();s+='='*(-len(s)%4);c=json.loads(base64.urlsafe_b64decode(s));print(json.dumps({k:c.get(k) for k in ['aud','repository','repository_owner','workflow','workflow_ref','job_workflow_ref','ref','environment','sub']},indent=2))"

      # Authenticates via OIDC trusted publishing — no npm token needed.
      # npmjs.com package settings must list this workflow as a Trusted Publisher.
      - name: Publish to npm
        run: npm publish --provenance --access public
