name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js 25
        uses: actions/setup-node@v6
        with:
          node-version: '25'

      - name: Install dependencies
        run: npm install

      - name: Audit dependencies (high+)
        # --omit=dev: the only remaining high-severity findings are dev-only
        # transitive vulns nested under @earendil-works/pi-coding-agent@0.80.x
        # (it pins undici exactly to 8.5.0; npm overrides do not reach that
        # subtree, and the only fix npm offers is a breaking downgrade). The
        # production dependency tree audits clean — that is what ships.
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Pack smoke test (tarball must ship required files)
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "const p=require('/tmp/pack.json')[0].files.map(f=>f.path); for (const need of ['scripts/cleanup-sessions.js','hermes/SKILL.md','prompts/memory-layer-protocols.md']) { if (!p.includes(need)) { console.error('MISSING FROM TARBALL: '+need); process.exit(1); } } console.log('pack smoke test OK')"

      - name: Smoke CLI tests
        run: node test/smoke-cli.js

      - name: Index repo (post-smoke verification)
        run: node memory-store.js index-repo --path . --name PiMemoryExtension

      - name: Index docs (post-smoke verification)
        run: node memory-store.js index-docs --path docs --name pi-docs
