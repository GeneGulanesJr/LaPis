name: Publish to npm

on:
  release:
    types: [published]

jobs:
  # ── Gate: validate the packed tarball as a real consumer would install it ──
  # (builds better-sqlite3, exercises the bin, audits the prod tree)
  pack-verify:
    uses: ./.github/workflows/pack-verify.yml

  # ── Gate: lint + test must pass before publish ──
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test

  publish:
    needs: [pack-verify, test]
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Verify package.json version matches the release tag
      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION  |  tag: $TAG_VERSION"
          [ "$PKG_VERSION" = "$TAG_VERSION" ] || { echo "::error::Version mismatch — tag=$TAG_VERSION pkg=$PKG_VERSION"; exit 1; }

      - run: npm publish --provenance --access public
